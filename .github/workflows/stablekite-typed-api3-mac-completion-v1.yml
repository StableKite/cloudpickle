name: Complete only two original Cloudpickle members that never acquired a Mac runner
'on':
  push:
    branches:
    - stablekite/typed-api3-mac-unexecuted-v1
jobs:
  build:
    strategy:
      matrix:
        include:
        - os: macos-latest
          python_version: '3.9'
        - os: macos-latest
          python_version: '3.11'
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: cdd431ae3984abcb632900784b84fb32bb80c229
    - name: Verify exact reviewed source
      shell: bash
      run: 'actual=$(git rev-parse HEAD)

        echo "reviewed_source=$actual"

        test "$actual" = "cdd431ae3984abcb632900784b84fb32bb80c229"

        '
    - name: Set up Python ${{ matrix.python_version }}
      if: ${{ !((runner.os == 'Linux' && contains(fromJSON('["3.8", "3.9"]'), matrix.python_version)) || (runner.os == 'macOS' && contains(fromJSON('["3.9", "3.10"]'), matrix.python_version))) }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python_version }}
        allow-prereleases: true
    - name: Build the actual legacy CPython minor natively
      if: ${{ (runner.os == 'Linux' && contains(fromJSON('["3.8", "3.9"]'), matrix.python_version)) || (runner.os == 'macOS' && contains(fromJSON('["3.9", "3.10"]'), matrix.python_version)) }}
      shell: bash
      env:
        PYENV_ROOT: ${{ runner.temp }}/stablekite-cloudpickle-legacy
      run: 'uname -a

        git clone --no-checkout https://github.com/pyenv/pyenv.git "$PYENV_ROOT"

        git -C "$PYENV_ROOT" checkout --detach 03ffc48ef3cd33808899773df586f3cc7f74470a

        test "$(git -C "$PYENV_ROOT" rev-parse HEAD)" = "03ffc48ef3cd33808899773df586f3cc7f74470a"

        version=$("$PYENV_ROOT/bin/pyenv" latest -k "${{ matrix.python_version }}")

        echo "actual_legacy_python_source_version=$version"

        shasum -a 256 "$PYENV_ROOT/plugins/python-build/share/python-build/$version"

        "$PYENV_ROOT/bin/pyenv" install "$version"

        "$PYENV_ROOT/versions/$version/bin/python" -c "import sys,platform; print(sys.version); print(platform.platform()); print(platform.machine())"

        echo "$PYENV_ROOT/versions/$version/bin" >> "$GITHUB_PATH"

        '
    - name: Install project and dependencies
      shell: bash
      run: 'python -m pip install --upgrade pip

        python -m pip install -e .

        python -m pip install -r dev-requirements.txt

        python ci/install_coverage_subprocess_pth.py

        export

        '
    - name: Display Python version
      shell: bash
      run: python -c "import sys; print(sys.version)"
    - name: Test with pytest
      shell: bash
      run: "COVERAGE_PROCESS_START=$GITHUB_WORKSPACE/.coveragerc \\\n  PYTHONPATH='.:tests' python -m pytest -r s\ncoverage combine --append\ncoverage xml -i\n"
    - name: Publish coverage results
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
